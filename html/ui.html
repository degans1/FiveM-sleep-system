<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExeDevelopment - Uyku & Dinlenme Arayüzü</title>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="sleep-container" style="display: none;">
        <!-- Arka Plan Yumuşak Karartma & Parçacık Işıltısı -->
        <div class="sleep-backdrop"></div>
        <div class="glow-orb top-left"></div>
        <div class="glow-orb bottom-right"></div>

        <!-- Üst Marka & Bilgi Başlığı -->
        <div class="brand-header">
            <div class="brand-pill">
                <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
                <span class="brand-text">ExeDevelopment <small>Dinlenme & Uyku Sistemi</small></span>
            </div>
            <div class="sleep-state-badge">
                <span class="pulse-dot"></span>
                <span id="badge-title">Derin Dinlenme Modu</span>
            </div>
        </div>

        <!-- Ana Kontrol Paneli -->
        <div class="control-panel">
            <!-- Sol Buton: Uyan / Kalk -->
            <button id="btn-wake" class="action-btn btn-wake" title="Şimdi Kalk">
                <div class="btn-glow"></div>
                <div class="btn-content">
                    <div class="icon-box">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="5"></circle>
                            <line x1="12" y1="1" x2="12" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="23"></line>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                            <line x1="1" y1="12" x2="3" y2="12"></line>
                            <line x1="21" y1="12" x2="23" y2="12"></line>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                        </svg>
                    </div>
                    <div class="btn-text-group">
                        <span class="btn-title">Uyan / Kalk</span>
                        <span class="btn-desc">Hemen dinlenmeyi sonlandır</span>
                    </div>
                </div>
            </button>

            <!-- Orta Bölüm: Uyku Animasyonu & Nabız Efekti -->
            <div class="sleep-center-status">
                <div class="sleep-circle-pulse">
                    <div class="pulse-ring ring-1"></div>
                    <div class="pulse-ring ring-2"></div>
                    <div class="pulse-ring ring-3"></div>
                    <div class="center-icon" id="center-icon-box">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M2 4v16M2 8h18a2 2 0 0 1 2 2v10M2 17h20M6 8v9"></path>
                        </svg>
                    </div>
                </div>
                <h2 class="sleep-heading" id="sleep-heading">Uyuyorsun...</h2>
                <p class="sleep-subheading" id="sleep-subheading">Vücudun dinleniyor ve enerjin yenileniyor</p>
            </div>

            <!-- Sağ Buton: Uykunu Tamamen Al (Quit) -->
            <button id="btn-quit" class="action-btn btn-quit" title="Uykunu Al ve Çıkış Yap">
                <div class="btn-glow"></div>
                <div class="btn-content">
                    <div class="icon-box">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                    </div>
                    <div class="btn-text-group">
                        <span class="btn-title">Uykunu Tamamen Al</span>
                        <span class="btn-desc">Yorgunluğu sıfırla & Güvenle çık</span>
                    </div>
                </div>
            </button>
        </div>

        <!-- Alt Bölüm: İlerleme Çubuğu (Progress Bar) -->
        <div class="progress-section">
            <div class="progress-info-row">
                <div class="progress-label">
                    <svg style="width: 18px; height: 18px; color: var(--accent-cyan);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="1" y="6" width="18" height="12" rx="2" ry="2"></rect>
                        <line x1="23" y1="13" x2="23" y2="11"></line>
                    </svg>
                    <span>Dinlenme İlerlemesi</span>
                </div>
                <div class="progress-percentage" id="progress-text">0%</div>
            </div>
            
            <div class="progress-track">
                <div class="progress-fill" id="progress-bar">
                    <div class="progress-flare"></div>
                </div>
            </div>

            <div class="progress-hint">
                <svg style="width: 15px; height: 15px; color: var(--accent-indigo); flex-shrink: 0;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="16" x2="12" y2="12"></line>
                    <line x1="12" y1="8" x2="12.01" y2="8"></line>
                </svg>
                <span>İlerleme %100 olduğunda yorgunluğunuz sıfırlanır ve otomatik olarak kalkarsınız.</span>
            </div>
        </div>
    </div>

    <!-- Custom JS -->
    <script src="script.js"></script>
</body>
</html>
